name: 'Sovereign Compliance Verify Action'
description: 'Automated EAA & WCAG 2.2 accessibility verification bridge for continuous CI pipelines.'
author: 'Sovereign Compliance Engine'

inputs:
  api-key:
    description: 'Scoped compliance API key (stored as repo secret COMPLIANCE_API_KEY).'
    required: true
  tenant-id:
    description: 'Bound tenant ID associated with the API key owner partition.'
    required: true
  target-url:
    description: 'Deployed preview or staging URL to scan (perimeter model, zero source code exfiltration).'
    required: true
  region:
    description: 'Sovereign partition region: europe-west1 or europe-west2 (leave empty for geo-routing).'
    required: false
    default: ''
  api-base:
    description: 'Compliance API base endpoint.'
    required: false
    default: 'https://api.compliance-audit.eu'
  tiers:
    description: 'Audit tiers to execute (1 = static AST fast-pass, 2 = Playwright + axe-core browser checks).'
    required: false
    default: '1,2'
  timeout-seconds:
    description: 'Maximum polling timeout for the audit job.'
    required: false
    default: '600'
  poll-interval-seconds:
    description: 'Polling interval in seconds.'
    required: false
    default: '10'
  fail-on:
    description: 'Failure gating policy: level-a, any-error, or never.'
    required: false
    default: 'level-a'
  comment:
    description: 'Whether to post/upsert a Markdown summary comment directly to the Pull Request.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR commenting and step summary access.'
    required: false
    default: ${{ github.token }}
  verify-chain:
    description: 'Call /v1/tenants/:id/audit/verify to append Merkle proof-chain verification status to summary.'
    required: false
    default: 'false'

outputs:
  audit-run-id:
    description: 'The unique audit run identifier generated by the engine.'
    value: ${{ steps.run-audit.outputs.audit-run-id }}
  verdict:
    description: 'Final execution verdict: success, failed, or blocked.'
    value: ${{ steps.run-audit.outputs.verdict }}
  level-a-failures:
    description: 'Count of critical WCAG Level A conformance failures.'
    value: ${{ steps.run-audit.outputs.level-a-failures }}

runs:
  using: 'composite'
  steps:
    - name: Run Accessibility & Compliance Verification
      id: run-audit
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_TENANT_ID: ${{ inputs.tenant-id }}
        INPUT_TARGET_URL: ${{ inputs.target-url }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_API_BASE: ${{ inputs.api-base }}
        INPUT_TIERS: ${{ inputs.tiers }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        INPUT_POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_VERIFY_CHAIN: ${{ inputs.verify-chain }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
      run: node "$GITHUB_ACTION_PATH/verify.mjs"

branding:
  icon: 'shield'
  color: 'blue'
